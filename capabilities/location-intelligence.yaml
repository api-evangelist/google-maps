naftiko: 1.0.0-alpha2
info:
  label: Google Maps Location Intelligence
  description: Unified workflow combining Google Maps Directions, Geocoding, and Places APIs for location-aware applications.
    Enables developers to geocode addresses, compute routes, search for places, and retrieve place details in a single integration.
  tags:
  - Google Maps
  - Location
  - Geocoding
  - Directions
  - Places
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    GOOGLE_MAPS_API_KEY: GOOGLE_MAPS_API_KEY
capability:
  consumes:
  - type: http
    namespace: google-maps-directions
    baseUri: https://maps.googleapis.com/maps/api
    description: Google Maps Directions API for computing routes between locations.
    authentication:
      type: apikey
      key: key
      value: '{{GOOGLE_MAPS_API_KEY}}'
      placement: query
    resources:
    - name: directions
      path: /directions/json
      description: Route computation between origin and destination
      operations:
      - name: get-directions
        method: GET
        description: Calculates directions between an origin and a destination with support for waypoints, travel modes, and
          traffic awareness.
        inputParameters:
        - name: origin
          in: query
          type: string
          required: true
          description: The starting point address, place ID, or coordinates
        - name: destination
          in: query
          type: string
          required: true
          description: The ending point address, place ID, or coordinates
        - name: mode
          in: query
          type: string
          required: false
          description: 'Travel mode: driving, walking, bicycling, or transit'
        - name: waypoints
          in: query
          type: string
          required: false
          description: Intermediate locations as pipe-separated values
        - name: alternatives
          in: query
          type: boolean
          required: false
          description: Return alternative routes when available
        - name: avoid
          in: query
          type: string
          required: false
          description: 'Features to avoid: tolls, highways, ferries'
        - name: language
          in: query
          type: string
          required: false
          description: Language code for results
        - name: units
          in: query
          type: string
          required: false
          description: 'Unit system: metric or imperial'
        - name: departure_time
          in: query
          type: string
          required: false
          description: Desired departure time as epoch seconds or 'now'
        - name: traffic_model
          in: query
          type: string
          required: false
          description: 'Traffic model: best_guess, pessimistic, or optimistic'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: google-maps-geocoding
    baseUri: https://maps.googleapis.com/maps/api
    description: Google Maps Geocoding API for converting addresses to coordinates and vice versa.
    authentication:
      type: apikey
      key: key
      value: '{{GOOGLE_MAPS_API_KEY}}'
      placement: query
    resources:
    - name: geocoding
      path: /geocode/json
      description: Forward and reverse geocoding operations
      operations:
      - name: geocode
        method: GET
        description: Converts an address to coordinates or coordinates to an address.
        inputParameters:
        - name: address
          in: query
          type: string
          required: false
          description: The street address or plus code to geocode
        - name: latlng
          in: query
          type: string
          required: false
          description: Latitude and longitude for reverse geocoding
        - name: place_id
          in: query
          type: string
          required: false
          description: The place ID to obtain the address for
        - name: components
          in: query
          type: string
          required: false
          description: Component filter as pipe-separated pairs
        - name: bounds
          in: query
          type: string
          required: false
          description: Bounding box to bias geocode results
        - name: region
          in: query
          type: string
          required: false
          description: Region code for biasing results
        - name: language
          in: query
          type: string
          required: false
          description: Language code for results
        - name: result_type
          in: query
          type: string
          required: false
          description: Filter by address type for reverse geocoding
        - name: location_type
          in: query
          type: string
          required: false
          description: Filter by location type for reverse geocoding
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: google-maps-places
    baseUri: https://places.googleapis.com/v1
    description: Google Maps Places API (New) for searching and retrieving place information.
    authentication:
      type: apikey
      key: X-Goog-Api-Key
      value: '{{GOOGLE_MAPS_API_KEY}}'
      placement: header
    resources:
    - name: place-details
      path: /places
      description: Get detailed information about a specific place
      operations:
      - name: get-place-details
        method: GET
        path: /{placeId}
        description: Returns detailed information about a place identified by its resource name.
        inputParameters:
        - name: placeId
          in: path
          type: string
          required: true
          description: The resource name of a place
        - name: X-Goog-FieldMask
          in: header
          type: string
          required: true
          description: Comma-separated list of fields to return
        - name: languageCode
          in: query
          type: string
          required: false
          description: BCP-47 language code for results
        - name: regionCode
          in: query
          type: string
          required: false
          description: Region code for biasing
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: text-search
      path: /places:searchText
      description: Search for places using a text query
      operations:
      - name: search-places-text
        method: POST
        description: Returns places matching a text query like 'pizza in New York'.
        inputParameters:
        - name: X-Goog-FieldMask
          in: header
          type: string
          required: true
          description: Comma-separated list of fields to return
        body:
          type: json
          data:
            textQuery: '{{tools.textQuery}}'
            includedType: '{{tools.includedType}}'
            languageCode: '{{tools.languageCode}}'
            maxResultCount: '{{tools.maxResultCount}}'
            openNow: '{{tools.openNow}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: nearby-search
      path: /places:searchNearby
      description: Search for places near a specific location
      operations:
      - name: search-places-nearby
        method: POST
        description: Returns places near a specified location with type and ranking filters.
        inputParameters:
        - name: X-Goog-FieldMask
          in: header
          type: string
          required: true
          description: Comma-separated list of fields to return
        body:
          type: json
          data:
            includedTypes: '{{tools.includedTypes}}'
            maxResultCount: '{{tools.maxResultCount}}'
            locationRestriction: '{{tools.locationRestriction}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: autocomplete
      path: /places:autocomplete
      description: Get place predictions based on text input
      operations:
      - name: autocomplete-places
        method: POST
        description: Returns place and query predictions for input text.
        body:
          type: json
          data:
            input: '{{tools.input}}'
            languageCode: '{{tools.languageCode}}'
            includeQueryPredictions: '{{tools.includeQueryPredictions}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: photos
      path: /places/{placeId}/photos
      description: Access photos associated with places
      operations:
      - name: get-place-photo
        method: GET
        path: /{photoReference}/media
        description: Returns a photo for a place.
        inputParameters:
        - name: placeId
          in: path
          type: string
          required: true
          description: The place ID
        - name: photoReference
          in: path
          type: string
          required: true
          description: The photo resource reference
        - name: maxHeightPx
          in: query
          type: integer
          required: false
          description: Maximum height in pixels (1-4800)
        - name: maxWidthPx
          in: query
          type: integer
          required: false
          description: Maximum width in pixels (1-4800)
        - name: skipHttpRedirect
          in: query
          type: boolean
          required: false
          description: Return JSON with URI instead of redirect
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: location-intelligence-api
    description: Unified REST API for location intelligence combining geocoding, directions, and places.
    resources:
    - path: /v1/geocode
      name: geocoding
      description: Address to coordinate conversion and reverse geocoding
      operations:
      - method: GET
        name: geocode
        description: Geocode an address or reverse geocode coordinates
        call: google-maps-geocoding.geocode
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/directions
      name: directions
      description: Route computation between locations
      operations:
      - method: GET
        name: get-directions
        description: Get directions between two or more locations
        call: google-maps-directions.get-directions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/places/{placeId}
      name: place-details
      description: Place details retrieval
      operations:
      - method: GET
        name: get-place-details
        description: Get detailed information about a place
        call: google-maps-places.get-place-details
        with:
          placeId: rest.placeId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/places/search-text
      name: text-search
      description: Text-based place search
      operations:
      - method: POST
        name: search-places-text
        description: Search for places using a text query
        call: google-maps-places.search-places-text
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/places/search-nearby
      name: nearby-search
      description: Location-based place search
      operations:
      - method: POST
        name: search-places-nearby
        description: Search for places near a location
        call: google-maps-places.search-places-nearby
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/places/autocomplete
      name: autocomplete
      description: Place autocomplete predictions
      operations:
      - method: POST
        name: autocomplete-places
        description: Get place predictions for input text
        call: google-maps-places.autocomplete-places
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: location-intelligence-mcp
    transport: http
    description: MCP server for AI-assisted location intelligence combining geocoding, directions, and places search.
    tools:
    - name: geocode
      description: Geocode an address to coordinates or reverse geocode coordinates to an address
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-geocoding.geocode
      outputParameters:
      - type: object
        mapping: $.
    - name: get-directions
      description: Get directions between two or more locations with support for driving, walking, bicycling, and transit
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-directions.get-directions
      outputParameters:
      - type: object
        mapping: $.
    - name: get-place-details
      description: Get detailed information about a place including address, rating, hours, and reviews
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-places.get-place-details
      outputParameters:
      - type: object
        mapping: $.
    - name: search-places-text
      description: Search for places using a natural language text query like 'pizza in New York'
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-places.search-places-text
      outputParameters:
      - type: object
        mapping: $.
    - name: search-places-nearby
      description: Search for places near a specific location with type filters
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-places.search-places-nearby
      outputParameters:
      - type: object
        mapping: $.
    - name: autocomplete-places
      description: Get place autocomplete predictions as the user types
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-places.autocomplete-places
      outputParameters:
      - type: object
        mapping: $.
    - name: get-place-photo
      description: Get a photo for a place by place ID and photo reference
      hints:
        readOnly: true
        openWorld: true
      call: google-maps-places.get-place-photo
      outputParameters:
      - type: object
        mapping: $.
