status_codes:
- code: OK
  meaning: Request succeeded and at least one result returned.
- code: ZERO_RESULTS
  meaning: Request succeeded but returned no results (e.g. unknown address, no route).
- code: INVALID_REQUEST
  meaning: Request was malformed or missing a required parameter.
- code: OVER_QUERY_LIMIT
  meaning: Caller exceeded the per-second or per-day request quota.
  action: Back off / raise quota in Cloud console.
- code: OVER_DAILY_LIMIT
  meaning: API key missing/invalid, billing not enabled, or daily quota/cap exceeded.
- code: REQUEST_DENIED
  meaning: Service denied the request (API not enabled for the key, key restriction, or missing key).
- code: NOT_FOUND
  meaning: A referenced location (origin, destination, waypoint, or place) could not be geocoded/found.
- code: MAX_WAYPOINTS_EXCEEDED
  meaning: Too many waypoints provided in a Directions request.
  source_api: Directions
- code: MAX_ROUTE_LENGTH_EXCEEDED
  meaning: Requested route is too long to process.
  source_api: Directions
- code: UNKNOWN_ERROR
  meaning: Server-side error; the request may succeed if retried.
  action: Retry with backoff.
