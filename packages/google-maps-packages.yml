  GitHub org. Web-service libraries (services-js/python/java/go) wrap the HTTP APIs;
  the JS loader + utility packages support the Maps JavaScript API. Native mobile SDKs
  (Maps/Places/Navigation SDK for Android & iOS) are distributed via Maven/Google
  Maven and CocoaPods/Swift Package Manager rather than these package registries.
