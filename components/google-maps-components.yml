note: >-
  Google Maps Platform ships client-side, embeddable Web Components (custom HTML elements)
  for adding maps and Places surfaces with minimal JavaScript. Built-in gmp-* elements are
  part of the Maps JavaScript API; the Extended Component Library (gmpx-*) adds higher-level
  prebuilt widgets; Places UI Kit provides prebuilt place detail/search surfaces.
families:
- family: Maps JavaScript API Web Components
