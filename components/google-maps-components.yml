  - gmpx-store-locator
  - gmpx-place-overview
  - gmpx-place-picker
  - gmpx-place-directions-button
  - gmpx-split-layout
  - gmpx-overlay-layout
  - gmpx-icon-button
  docs: https://github.com/googlemaps/extended-component-library
- family: Places UI Kit
