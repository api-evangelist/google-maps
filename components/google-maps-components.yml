  prefix: gmp-
  components:
  - gmp-map
  - gmp-advanced-marker
  - gmp-place-picker
  - gmp-place-autocomplete
  docs: https://developers.google.com/maps/documentation/javascript/web-components/overview
- family: Extended Component Library
  loader: "@googlemaps/extended-component-library"
